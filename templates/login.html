<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Viáticos CENOSA</title>
    <!-- Enlace corregido para FastAPI -->
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body class="login-body">
    <!-- Barra superior verde -->
    <header class="login-header">
        <div class="header-content">
            <h1>Panel de Viáticos</h1>
        </div>
    </header>

    <!-- Contenedor central del Login -->
    <main class="login-main">
        <div class="login-card">
            <h2>Acceso de la encargada</h2>
            
            <!-- Aquí mostramos el mensaje de error si la contraseña es incorrecta -->
            {% if error %}
            <div class="msg err" style="background: #fde8e6; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>

            <div class="login-links">
                <!-- Enlace corregido también -->
                <a href="/?token=cenosa2026">← Ir al portal de empleados</a>
            </div>
        </div>
    </main>
</body>
</html>
