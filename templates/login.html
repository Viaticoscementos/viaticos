<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Viáticos CENOSA</title>
    <link rel="stylesheet" href="/static/estilos.css">
    <!-- Iconos para los campos (opcional, hace que se vea más moderno) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">
    <!-- Barra superior verde -->
    <header class="login-header">
        <div class="header-content">
            <h1>Portal de Viáticos</h1>
        </div>
    </header>

    <!-- Contenedor central del Login -->
    <main class="login-main">
        <div class="login-card">
            <!-- Aquí va el logo. Si tu imagen se llama diferente, cambia 'logo_color.png' por el nombre exacto -->
            <div class="logo-container">
                <img src="/static/logo_color.png" alt="Cementos del Norte" class="login-logo">
            </div>

            <h2>Acceso de la encargada</h2>
            
            {% if error %}
            <div class="msg err" style="background: #fde8e6; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; animation: shake 0.5s;">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="usuario"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej. Bertha Padilla" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="btn-entrar">
                    Entrar <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>

            <div class="login-links">
                <a href="/?token=cenosa2026"><i class="fas fa-users"></i> Ir al portal de empleados</a>
            </div>
        </div>
    </main>
</body>
</html>
