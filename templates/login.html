<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso - Viaticos CENOSA</title>
<link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
<div class="topbar">
  <img src="/static/logo_header.png" alt="CENOSA" onerror="this.style.display='none'">
  <h1>Panel de Viaticos</h1>
</div>
<div class="loginbox card">
  <h2>Acceso de la encargada</h2>
  {% if error %}<div class="msg err">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post" action="/login">
    <div style="margin-bottom:12px">
      <label>Usuario</label>
      <input name="usuario" autofocus required>
    </div>
    <div style="margin-bottom:16px">
      <label>Contraseña</label>
      <input name="password" type="password" required>
    </div>
    <button class="btn" type="submit" style="width:100%">Entrar</button>
  </form>
  <p class="small" style="margin-top:14px"><a href="/">&larr; Ir al portal de empleados</a></p>
</div>
</body>
</html>
