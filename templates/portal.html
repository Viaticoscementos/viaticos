<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reembolso de Viáticos - CENOSA</title>
    <link rel="stylesheet" href="/static/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body" style="background: var(--bg-body);">

    <!-- Barra superior -->
    <header class="login-header" style="display: flex; align-items: center; gap: 15px;">
        <img src="/static/logo_color.png" alt="Logo" style="height: 40px; background: white; padding: 5px; border-radius: 8px;">
        <h1 style="margin: 0; font-size: 1.2rem;">Portal de Reembolsos</h1>
    </header>

    <div class="content-wrapper" style="max-width: 800px; padding-top: 40px;">
        <div class="card" style="background: white; border-radius: 16px; padding: 30px; box-shadow: var(--shadow-md);">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="color: var(--verde-cenosa); margin-bottom: 10px;">Sube tu factura</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">
                    Sube la foto o PDF de tu factura. El sistema extraerá los datos automáticamente (RTN, CAI, fecha, monto) y registrará tu solicitud.
                </p>
            </div>

            <form id="form-factura" enctype="multipart/form-data">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Tu nombre</label>
                        <select name="empleado" required style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;">
                            <option value="">Selecciona tu nombre...</option>
                            {% for e in empleados %}
                            <option value="{{ e }}">{{ e }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Categoría del gasto</label>
                        <select name="categoria" required style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;">
                            <option value="Alimentacion">Alimentación</option>
                            <option value="Hotel">Hotel</option>
                            <option value="Combustible">Combustible / Gasolina</option>
                            <option value="Asistencia Tecnica">Asistencia Técnica</option>
                            <option value="Mercadeo">Mercadeo</option>
                            <option value="Otros Gastos">Otros Gastos</option>
                        </select>
                    </div>
                </div>

                <!-- Zona de subida de archivo -->
                <div class="form-group" style="margin-top: 20px; border: 2px dashed var(--verde-cenosa); padding: 40px 20px; border-radius: 12px; text-align: center; background: #f8fafc; cursor: pointer; transition: all 0.3s;" onclick="document.getElementById('archivo').click()">
                    <i class="fas fa-file-invoice" style="font-size: 3rem; color: var(--verde-cenosa); margin-bottom: 15px;"></i>
                    <p style="margin: 0; font-weight: 600; color: var(--text-main); font-size: 1.1rem;">Haz clic aquí para subir tu factura</p>
                    <p style="margin: 5px 0 0; font-size: 0.85rem; color: var(--text-muted);">Formatos aceptados: JPG, PNG o PDF</p>
                    <input type="file" id="archivo" name="archivo" accept="image/*,application/pdf" style="display: none;" required onchange="document.getElementById('file-name').innerText = this.files[0].name">
                    <div id="file-name" style="margin-top: 15px; font-weight: bold; color: var(--verde-cenosa); background: #e6f6ec; display: inline-block; padding: 5px 15px; border-radius: 20px;"></div>
                </div>

                <button type="submit" class="btn-entrar" style="margin-top: 25px; width: 100%; border-radius: 8px; padding: 15px; font-size: 1.1rem;">
                    <i class="fas fa-robot" style="margin-right: 8px;"></i> Analizar y Enviar Factura
                </button>
            </form>
            
            <div id="resultado" style="margin-top: 25px; display: none;"></div>
        </div>
    </div>

    <script>
        document.getElementById('form-factura').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const resDiv = document.getElementById('resultado');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analizando factura con IA...';
            btn.disabled = true;
            resDiv.style.display = 'none';
            
            const formData = new FormData(form);

            try {
                const response = await fetch('/api/validar', { method: 'POST', body: formData });
                const data = await response.json();
                
                resDiv.style.display = 'block';
                if (data.cumple) {
                    resDiv.innerHTML = `<div style="background: #dcfce7; color: #16a34a; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #bbf7d0;">
                        <h3 style="margin: 0 0 10px;"><i class="fas fa-check-circle"></i> ¡Factura Registrada Exitosamente!</h3>
                        <p style="font-size: 1.1rem; margin-bottom: 5px;">Monto detectado: <strong>L ${data.monto_extraido}</strong></p>
                        <p style="margin: 0; font-size: 0.9rem;">Folio de solicitud: <strong>${data.folio}</strong></p>
                    </div>`;
                } else {
                    resDiv.innerHTML = `<div style="background: #fef3c7; color: #d97706; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #fde68a;">
                        <h3 style="margin: 0 0 10px;"><i class="fas fa-exclamation-triangle"></i> Requiere Revisión Manual</h3>
                        <p style="margin-bottom: 5px;">El sistema no pudo validar todos los datos automáticamente o excede el límite.</p>
                        <p style="font-size: 0.9rem;">Motivo: ${data.motivos}</p>
                        <p style="margin: 0; font-size: 0.9rem;">Folio: <strong>${data.folio}</strong></p>
                    </div>`;
                }
                form.reset();
                document.getElementById('file-name').innerText = '';
            } catch (error) {
                resDiv.innerHTML = `<div style="background: #fee2e2; color: #dc2626; padding: 20px; border-radius: 12px; text-align: center;">Error de conexión. Intenta de nuevo.</div>`;
                resDiv.style.display = 'block';
            } finally {
                btn.innerHTML = '<i class="fas fa-robot" style="margin-right: 8px;"></i> Analizar y Enviar Factura';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
